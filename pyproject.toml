[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-dev-agent"
version = "0.1.0"
description = "A scaffold for an autonomous dev agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
llm = [
    "anthropic>=0.40,<1.0",
]

[project.scripts]
autonomous-dev-agent = "autonomous_dev_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


